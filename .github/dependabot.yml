# Weekly checks for outdated or vulnerable dependencies; security fixes open PRs right away.
# Minor and patch updates are grouped into one PR per ecosystem to keep the noise down.
# Major upgrades (e.g. TypeScript 5 → 7, zod 3 → 4) are skipped: they need planned, tested
# migrations, so we do them deliberately. Vulnerabilities still show under Security → Dependabot.
version: 2
updates:
  - package-ecosystem: npm # yarn workspaces, one lockfile at the root
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # PGlite 0.5 can't open data directories made by 0.3 (checked against real local data),
      # so moving up means exporting and re-importing local databases. Do it deliberately.
      - dependency-name: "@electric-sql/pglite"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Africa/Nairobi
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
