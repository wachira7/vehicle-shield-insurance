name: Deploy contracts to Sepolia

# Manual only. The `sepolia` environment should require reviewer approval
# (Settings > Environments) and hold the deploy secrets.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "deploy" to confirm a fresh deployment
        required: true

defaults:
  run:
    working-directory: vehicle-backend

jobs:
  deploy:
    if: inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    environment: sepolia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: vehicle-backend/yarn.lock
      - run: yarn install --frozen-lockfile
      - name: Tests must pass before deploying
        run: yarn test
      - name: Deploy
        run: yarn deploy:sepolia
        env:
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          QUOTE_SIGNER_ADDRESS: ${{ vars.QUOTE_SIGNER_ADDRESS }}
          ASSESSOR_ADDRESS: ${{ vars.ASSESSOR_ADDRESS }}
          TREASURER_ADDRESS: ${{ vars.TREASURER_ADDRESS }}
          PAUSER_ADDRESS: ${{ vars.PAUSER_ADDRESS }}
          USDC_ADDRESS: ${{ vars.USDC_ADDRESS }}
          SEED_POOL_USDC: ${{ vars.SEED_POOL_USDC }}
      - uses: actions/upload-artifact@v4
        with:
          name: sepolia-deployment
          path: vehicle-backend/deployments/sepolia.json
