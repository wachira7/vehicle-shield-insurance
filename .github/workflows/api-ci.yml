name: API CI

on:
  push:
    branches: [main]
    paths: ["vehicle-api/**", "packages/**", "yarn.lock", ".github/workflows/api-ci.yml"]
  # Every PR runs this workflow: its checks are required, and a required check
  # that never runs would block the merge.
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Protocol and API (type-check, test, smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @vehicle-shield/protocol typecheck
      - run: yarn workspace @vehicle-shield/protocol test
      - run: yarn workspace vehicle-shield-api typecheck
      - run: yarn workspace vehicle-shield-api test
      - name: Boot the API under Node's real module loader
        run: yarn workspace vehicle-shield-api smoke
